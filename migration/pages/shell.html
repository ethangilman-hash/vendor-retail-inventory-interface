<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · Par</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#243744;font:14px system-ui}.mast{padding:18px 28px;background:#0b2132;color:white;font-size:26px;font-weight:750}main{max-width:420px;margin:65px auto;padding:28px;background:white;border:1px solid #dce3e9;border-radius:12px}p{line-height:1.6;color:#667782}label{display:block;margin-top:20px}input,button{font:inherit;width:100%;padding:13px;margin-top:8px;border:1px solid #cbd5de;border-radius:5px}button{margin-top:25px;background:#0076e8;color:white;cursor:pointer}#error{color:#9d3830}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}</style></head><body><div class="mast">par ↗</div><main><h1>Welcome back.</h1><p>Sign in to your inventory workspace.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" maxlength="100" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><button id="submit">Log in</button><p id="error" role="alert"></p></form><p>Sample-data demo · Separate Par account</p></main><script>
const payload=__PAR_PAYLOAD__, endpoint=__PAR_ENDPOINT__;
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let appFrame=null;
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const response=await fetch(endpoint+'/auth/unlock',{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const result=await response.json();if(!response.ok)throw Error(result.error||'Unable to sign in.');const key=await crypto.subtle.importKey('raw',decode(result.key),'AES-GCM',false,['decrypt']);const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.data));const frame=document.createElement('iframe');frame.title='Par inventory workspace';frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-downloads');frame.srcdoc=new TextDecoder().decode(bytes);appFrame=frame;document.body.append(frame);document.getElementById('password').value='';}catch(err){error.textContent=err instanceof TypeError?'Cannot reach the login service. Please try again.':err.message;}finally{button.disabled=false;}};
window.addEventListener('message',e=>{if(appFrame&&e.source===appFrame.contentWindow&&e.origin===location.origin&&e.data==='par:logout'){appFrame.remove();appFrame=null;document.getElementById('username').focus();}});
</script></body></html>
